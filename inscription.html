<body data-page="inscription">
    <a class="skip" href="#main">Aller au contenu</a>
    <div id="site-header">
        <noscript>
            <nav class="nojs" aria-label="Navigation principale">
                <a href="index.html">Accueil</a>
                <a href="joueur.html">Joueurs</a>
                <a href="results.html">Résultats</a>
                <a href="news.html">Actus</a>
                <a href="about.html">À propos</a>
                <a href="contact.html">Contact</a>
                <a href="inscription.html">Rejoindre la team</a>
            </nav>
        </noscript>
    </div>
    <main id="main">
        <section class="page-hero">
            <div class="container">
                <p class="eyebrow">Recrutement</p>
                <h1>Rejoindre la <span class="grad">team</span></h1>
                <p class="lead">Remplis ta candidature : pas de compte à créer, on te répond par email.</p>
            </div>
        </section>
        <section class="section" style="padding-top:1rem">
            <div class="container">
                <form class="form" data-form="apply" novalidate>
                    <div class="form-grid">
                        <div class="field">
                            <label for="pubgm_pseudo">Pseudo PUBG *</label>
                            <input id="pubgm_pseudo" name="pubgm_pseudo" maxlength="20" required>
                        </div>
                        <div class="field">
                            <label for="pubgm_id">ID PUBG (10 chiffres) *</label>
                            <input id="pubgm_id" name="pubgm_id" inputmode="numeric" pattern="\d{10}" maxlength="10" required>
                        </div>
                        <div class="field">
                            <label for="email">Email *</label>
                            <input id="email" name="email" type="email" autocomplete="email" required>
                        </div>
                        <div class="field">
                            <label for="birth_date">Date de naissance *</label>
                            <input id="birth_date" name="birth_date" type="date" autocomplete="bday" required>
                        </div>
                        <div class="field">
                            <label for="ranking">Classement</label>
                            <select id="ranking" name="ranking">
                                <option>Bronze</option>
                                <option>Argent</option>
                                <option>Or</option>
                                <option>Platine</option>
                                <option>Diamant</option>
                                <option>Couronne</option>
                                <option>Champion</option>
                                <option>Maître Champion</option>
                                <option>Dominateur Champion</option>
                                <option>Conquérant</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="device">Appareil</label>
                            <select id="device" name="device">
                                <option>Android</option>
                                <option>iPhone</option>
                                <option>iPad</option>
                                <option>Tablette</option>
                                <option>PC (Emulateur)</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="region">Région</label>
                            <select id="region" name="region">
                                <option>Afrique</option>
                                <option>Europe</option>
                                <option>Asie</option>
                                <option>Amérique</option>
                                <option>Océanie</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="game_mode">Mode de jeu préféré</label>
                            <select id="game_mode" name="game_mode">
                                <option>Classique Classé</option>
                                <option>Ultimate Royale</option>
                                <option>Arène</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="discord">Discord (optionnel)</label>
                            <input id="discord" name="discord">
                        </div>
                    </div>
                    <fieldset class="field">
                        <legend>Rôles joués</legend>
                        <div class="checks">
                            <label><input type="checkbox" name="roles" value="IGL"> IGL</label>
                            <label><input type="checkbox" name="roles" value="Entry Fragger"> Entry Fragger</label>
                            <label><input type="checkbox" name="roles" value="Support"> Support</label>
                            <label><input type="checkbox" name="roles" value="Sniper"> Sniper</label>
                            <label><input type="checkbox" name="roles" value="Flanker"> Flanker</label>
                            <label><input type="checkbox" name="roles" value="Driver"> Driver</label>
                        </div>
                    </fieldset>
                    <div class="field">
                        <label for="message">Parle-nous de toi</label>
                        <textarea id="message" name="message" rows="5"></textarea>
                    </div>
                    <label>
                        <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
                    </label>
                    <button class="btn btn-primary" type="submit">Envoyer ma candidature</button>
                </form>
            </div>
        </section>
    </main>
    <div id="site-footer"></div>
</body>
</html>
